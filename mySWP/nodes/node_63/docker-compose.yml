version: "3.9"
services:
  create-snapshots:
    container_name: create-snapshots
    build:
      context: ../
      dockerfile: Dockerfile
    image: hornet:dev
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.20
    volumes:
      - ./protocol_parameters.json:/app/protocol_parameters.json:ro
      - ./snapshots:/app/snapshots
    command:
      - "tool"
      - "snap-gen"
      - "--protocolParametersPath=/app/protocol_parameters.json"
      - "--mintAddress=tst1qq2kvnu9pqzptkggrpqrvltvagccsh6aj2fkdhla7p3lrsy9dwhdzu5l2ye"
      - "--genesisAddresses=tst1qpszqzadsym6wpppd6z037dvlejmjuke7s24hm95s9fg9vpua7vlupxvxq2:1000000000000,tst1qqweu75ldpyann5jsthqsa6m0thx4tmqxncj6uqxf5q974pmqx30y5mcdp2:1000000000000"
      - "--outputPath=/app/snapshots/hornet/full_snapshot.bin"
    profiles:
      - snapshots

  bootstrap-network:
    container_name: bootstrap-network
    build:
      context: ../
      dockerfile: Dockerfile
    image: hornet:dev
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.20
    environment:
      - "COO_PRV_KEYS=651941eddb3e68cb1f6ef4ef5b04625dcf5c70de1fdc4b1c9eadb2c219c074e0ed3c3f1a319ff4e909cf2771d79fece0ac9bd9fd2ee49ea6c0885c9cb3b1248c,0e324c6ff069f31890d496e9004636fd73d8e8b5bea08ec58a4178ca85462325f6752f5f46a53364e2ee9c4d662d762a81efd51010282a75cd6bd03f28ef349c"
    volumes:
      - ./config_private_tangle.json:/app/config_private_tangle.json:ro
      - ./snapshots/hornet:/app/snapshots
      - ./privatedb/hornet:/app/privatedb
      - ./privatedb/state:/app/state
    command:
      - "tool"
      - "bootstrap-private-tangle"
      - "--configFile=/app/config_private_tangle.json"
      - "--snapshotPath=/app/snapshots/full_snapshot.bin"
      - "--databasePath=/app/privatedb"
      - "--cooStatePath=/app/state/coordinator.state"
    profiles:
      - bootstrap

  #
  # Nodes
  #
  hornet-1:
    container_name: hornet-63
    build:
      context: ../
      dockerfile: Dockerfile
    image: hornet:dev
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.20
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 5m
    ports:
      - "15663:15600/tcp"
      - "14263:14265/tcp"
      - "9630:9311/tcp"
      - "9631:9029/tcp"
      - "6630:6060/tcp"
    cap_drop:
      - ALL
    volumes:
      - ./config_private_tangle.json:/app/config_private_tangle.json:ro
      - ./privatedb/hornet:/app/privatedb
      - ./snapshots/hornet:/app/snapshots
    command:
      - "-c"
      - "config_private_tangle.json"
      - "--node.alias=hornet-1"
      - "--inx.enabled=true"
      - "--inx.bindAddress=172.18.263.20:9029"
      - "--p2p.identityPrivateKey=1f46fad4f538a031d4f87f490f6bca4319dfd0307636a5759a22b5e8874bd608f9156ba976a12918c16a481c38c88a7b5351b769adc30390e93b6c0a63b09b79"
      - "--p2p.peers=/ip4/172.18.222.11/tcp/15600/p2p/12D3KooWCKwcTWevoRKa2kEBputeGASvEBuDfRDSbe8t1DWugUmL,/ip4/172.18.223.11/tcp/15600/p2p/12D3KooWGdr8M5KX8KuKaXSiKfHJstdVnRkadYmupF7tFk2HrRoA,/ip4/172.18.224.11/tcp/15600/p2p/12D3KooWC7uE9w3RN4Vh1FJAZa8SbE8yMWR6wCVBajcWpyWguV73"
      - "--p2p.peerAliases=hornet-2,hornet-3,hornet-4"
      - "--debug.enabled=true"
      - "--prometheus.enabled=true"
      - "--prometheus.bindAddress=172.18.263.20:9311"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.20:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  #
  # INX
  # 
  inx-coordinator-1:
    container_name: inx-coordinator-63
    image: iotaledger/inx-coordinator:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.21
    depends_on:
      hornet-1:
        condition: service_healthy
    environment:
      - "COO_PRV_KEYS=651941eddb3e68cb1f6ef4ef5b04625dcf5c70de1fdc4b1c9eadb2c219c074e0ed3c3f1a319ff4e909cf2771d79fece0ac9bd9fd2ee49ea6c0885c9cb3b1248c,0e324c6ff069f31890d496e9004636fd73d8e8b5bea08ec58a4178ca85462325f6752f5f46a53364e2ee9c4d662d762a81efd51010282a75cd6bd03f28ef349c"
    ports:
      - "6631:6060/tcp"
    volumes:
      - ./privatedb/state:/app/state
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--coordinator.stateFilePath=state/coordinator.state"
      - "--coordinator.blockBackups.enabled=false"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.21:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-indexer-1:
    container_name: inx-indexer-63
    image: iotaledger/inx-indexer:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.22
    depends_on:
      hornet-1:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9632:9311/tcp"
      - "6632:6060/tcp"
    volumes:
      - ./privatedb/indexer:/app/database
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--restAPI.bindAddress=172.18.263.22:9091"
      - "--prometheus.enabled=true"
      - "--prometheus.bindAddress=172.18.263.22:9311"
      - "--prometheus.goMetrics=false"
      - "--prometheus.processMetrics=false"
      - "--prometheus.restAPIMetrics=true"
      - "--prometheus.inxMetrics=true"
      - "--prometheus.promhttpMetrics=false"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.22:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-mqtt-1:
    container_name: inx-mqtt-63
    image: iotaledger/inx-mqtt:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.23
    depends_on:
      hornet-1:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9633:9311/tcp"
      - "6633:6060/tcp"
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--mqtt.websocket.bindAddress=172.18.263.23:1888"
      - "--prometheus.enabled=true"
      - "--prometheus.bindAddress=172.18.263.23:9311"
      - "--prometheus.goMetrics=false"
      - "--prometheus.mqttMetrics=true"
      - "--prometheus.processMetrics=false"
      - "--prometheus.promhttpMetrics=false"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.23:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-faucet-1:
    container_name: inx-faucet-63
    image: iotaledger/inx-faucet:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.24
    depends_on:
      hornet-1:
        condition: service_healthy
      inx-indexer-1:
        condition: service_started
    restart: on-failure
    ports:
      - "8634:8091/tcp"
      - "6634:6060/tcp"
    environment:
      - "FAUCET_PRV_KEY=887844b1e6bf9ca9e0b57584656add4370dbb49a8cb79e2e3032229f30fd80359e3df559ad0de8e5fa019b9ea46d1ee40879f3f3f74594a3306de9dfd43dcd25"
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--faucet.bindAddress=172.18.263.24:8091"
      - "--faucet.amount=100000000000"
      - "--faucet.smallAmount=10000000000"
      - "--faucet.maxAddressBalance=200000000000"
      - "--faucet.rateLimit.enabled=false"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.24:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-participation-1:
    container_name: inx-participation-63
    image: iotaledger/inx-participation:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.25
    depends_on:
      hornet-1:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9635:9892/tcp"
      - "6635:6060/tcp"
    volumes:
      - ./privatedb/participation:/app/database
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--restAPI.bindAddress=172.18.263.25:9892"
      - "--participation.db.path=/app/database"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.25:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-spammer-1:
    container_name: inx-spammer-63
    image: iotaledger/inx-spammer:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.26
    depends_on:
      hornet-1:
        condition: service_healthy
      inx-indexer-1:
        condition: service_started
    restart: on-failure
    ports:
      - "9636:9311/tcp"
      - "9639:9092/tcp"
      - "6636:6060/tcp"
    environment:
      - "SPAMMER_MNEMONIC=reward addict anger tongue denial supply cattle lawn foot climb ask friend base spring ensure spike alien equal burst bitter crowd august ignore animal"
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--restAPI.bindAddress=172.18.263.26:9092"
      - "--spammer.autostart=true"
      - "--spammer.bpsRateLimit=50"
      - "--spammer.cpuMaxUsage=0.0"
      - "--spammer.workers=0"
      - "--spammer.valueSpam.enabled=true"
      - "--spammer.valueSpam.sendBasicOutput=true"
      - "--spammer.valueSpam.collectBasicOutput=true"
      - "--spammer.valueSpam.createAlias=true"
      - "--spammer.valueSpam.destroyAlias=true"
      - "--spammer.valueSpam.createFoundry=true"
      - "--spammer.valueSpam.destroyFoundry=true"
      - "--spammer.valueSpam.mintNativeToken=true"
      - "--spammer.valueSpam.meltNativeToken=true"
      - "--spammer.valueSpam.createNFT=true"
      - "--spammer.valueSpam.destroyNFT=true"
      - "--prometheus.enabled=true"
      - "--prometheus.bindAddress=172.18.263.26:9311"
      - "--prometheus.spammerMetrics=true"
      - "--prometheus.goMetrics=false"
      - "--prometheus.processMetrics=false"
      - "--prometheus.promhttpMetrics=false"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.26:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-poi-1:
    container_name: inx-poi-63
    image: iotaledger/inx-poi:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.27
    depends_on:
      hornet-1:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9637:9687/tcp"
      - "6637:6060/tcp"
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--restAPI.bindAddress=172.18.263.27:9687"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.27:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

  inx-dashboard-1:
    container_name: inx-dashboard-63
    image: iotaledger/inx-dashboard:1.0
    networks:
      nodenet-1:
        ipv4_address: 172.18.263.28
    depends_on:
      hornet-1:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9638:9311/tcp"
      - "8638:8081/tcp"
      - "6638:6060/tcp"
    command:
      - "--inx.address=172.18.263.20:9029"
      - "--dashboard.bindAddress=172.18.263.28:8081"
      - "--dashboard.auth.passwordHash=577eb97f8faf2af47ff957b00827d6bfe9d05b810981e3073dc42553505282c1"
      - "--dashboard.auth.passwordSalt=e5d8d0bd3bb9723236177b4713a11580c55b69a51e7055dd11fa1dad3b8f6d6c"
      - "--dashboard.auth.identityPrivateKey=1f46fad4f538a031d4f87f490f6bca4319dfd0307636a5759a22b5e8874bd608f9156ba976a12918c16a481c38c88a7b5351b769adc30390e93b6c0a63b09b79"
      - "--prometheus.enabled=false"
      - "--prometheus.bindAddress=172.18.263.28:9311"
      - "--prometheus.goMetrics=false"
      - "--prometheus.processMetrics=false"
      - "--prometheus.promhttpMetrics=false"
      - "--profiling.enabled=true"
      - "--profiling.bindAddress=172.18.263.28:6060"
    profiles:
      - 2-nodes
      - 3-nodes
      - 4-nodes

networks:
  nodenet-1:
    ipam:
      driver: default
      config:
        - subnet: 172.18.263.0/24
